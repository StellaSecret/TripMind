name: Build TripMind APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1 — Récupérer le code
      - name: Checkout
        uses: actions/checkout@v4

      # 2 — Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3 — Java (requis par Gradle/Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4 — Installer les dépendances npm
      - name: Install dependencies
        run: npm ci

      # 5 — Ajouter la plateforme Android si absente (premier build ou android/ non commité)
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "android/ absent, exécution de cap add android..."
            npx cap add android
          else
            echo "android/ déjà présent."
          fi

      # 6 — Synchroniser Capacitor (copie www/ dans le projet Android)
      - name: Capacitor sync
        run: npx cap sync android

      # 7 — Rendre gradlew exécutable
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 8 — Build APK debug
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 9 — Créer une Release GitHub et attacher l'APK
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "TripMind build #${{ github.run_number }}"
          body: |
            ## TripMind — Build automatique #${{ github.run_number }}

            ### APIs intégrées
            - 🌤 Météo + UV : Open-Meteo (sans clé)
            - 💨 Qualité air + Pollen : Open-Meteo / Copernicus CAMS (sans clé)
            - 📍 Géocodage : Base Adresse Nationale — data.gouv.fr (sans clé)
            - 🚗 Itinéraire routier : OSRM / OpenStreetMap (sans clé)
            - 🚆 Trains : Navitia (token optionnel — configurable dans l'app)

            ### Installation
            Téléchargez `app-debug.apk`, activez **Sources inconnues** sur votre Android, puis installez.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
