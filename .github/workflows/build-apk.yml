name: Build TripMind

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── JOB 1 : Build ─────────────────────────────────────
  build:
    name: Build AAB (Play Store) + APK (sideload)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/tripmind-release.jks

      - name: Set versionCode
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          echo "versionCode → ${{ github.run_number }}"
          grep versionCode android/app/build.gradle

      - name: Build AAB release (signé)
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/tripmind-release.jks \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build APK Release
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/tripmind-release.jks \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab \
             dist/tripmind-${{ github.run_number }}.aab
          cp android/app/build/outputs/apk/release/app-release.apk \
             dist/tripmind-${{ github.run_number }}.apk
          cp android/app/build/outputs/mapping/release/mapping.txt \
             dist/mapping-${{ github.run_number }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ github.run_number }} — versionCode ${{ github.run_number }}
          path: dist/
          retention-days: 1

  # ── JOB 2 : Release ───────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-${{ github.run_number }} — versionCode ${{ github.run_number }}
          path: dist/

      - name: List artifacts (debug)
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "TripMind build #${{ github.run_number }}"
          body: |
            Build #${{ github.run_number }}

            📦 **tripmind-${{ github.run_number }}.aab** → Upload sur Play Store
            📱 **tripmind-${{ github.run_number }}.apk** → Installation directe (tests)
          files: |
            dist/tripmind-${{ github.run_number }}.aab
            dist/tripmind-${{ github.run_number }}.apk
            dist/mapping-${{ github.run_number }}.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
