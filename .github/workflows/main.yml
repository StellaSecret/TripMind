name: CI/CD TripMind

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 9 * *'  # Every 9th of the month at 02:00 UTC — runs @live Playwright tests
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  security-events: write
  actions: read

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  # ── SÉCURITÉ 1 : SCAN DE SECRETS ───────────────────────
  scan-secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ── SÉCURITÉ 2 : ANALYSE STATIQUE (CODEQL) ─────────────
  codeql-analysis:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - name: Perform Analysis
        uses: github/codeql-action/analyze@v4

  # ── SÉCURITÉ 3 : AUDIT NPM ─────────────────────────────
  npm-security:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install & Audit
        run: |
          npm ci
          npm audit --audit-level=high

  # ── UNIT TESTS (Vitest — no browser, ~5s) ──────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: unit/package-lock.json

      - name: Install unit test dependencies
        working-directory: unit
        run: npm ci

      - name: Run unit tests
        working-directory: unit
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ github.run_number }}
          path: unit/coverage/
          retention-days: 14

  # ── TESTS NON-RÉGRESSION (Playwright) ──────────────────
  # Runs in parallel with unit tests — both must pass before deploy
  playwright-tests:
    name: Non-Regression Tests
    needs: [scan-secrets, codeql-analysis, npm-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright (isolated in e2e/)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Serve app on port 3000
        run: |
          npm ci
          npx serve www --listen 3000 &
          echo "Waiting for app to be ready..."
          timeout 30 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 1; done'
          echo "App is ready on port 3000"

      - name: Run offline tests (Chromium)
        working-directory: e2e
        run: npx --no playwright test --grep-invert "@live" --project=chromium
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: e2e/test-results/
          retention-days: 7


  # ── TESTS @LIVE NOCTURNES (Playwright — vraie réseau) ──
  # Tourne chaque 9 du mois à 02h00 UTC pour détecter les régressions
  # dues aux changements d'API Transitous / Nominatim / BAN.
  playwright-live-tests:
    name: Live API Tests (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Serve app on port 3000
        run: |
          npm ci
          npx serve www --listen 3000 &
          timeout 30 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 1; done'

      - name: Run @live tests (Chromium)
        working-directory: e2e
        run: npx --no playwright test --grep "@live" --project=chromium
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload live test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-report-${{ github.run_number }}
          path: e2e/playwright-report/
          retention-days: 7

  # ── DÉPLOIEMENT PAGES (Bloqué par unit + playwright) ───
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [unit-tests, playwright-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # ── BUILD ANDROID (Bloqué par unit + playwright) ────────
  build-android:
    name: Build AAB & APK
    needs: [unit-tests, playwright-tests]
    runs-on: ubuntu-latest
    outputs:
      artifact-name: artifacts-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install & Sync
        run: |
          npm ci
          npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/tripmind-release.jks

      - name: Build Android App
        run: |
          cd android
          chmod +x gradlew
          VCODE=$(date -u +%Y%m%d)${{ github.run_number }}
          sed -i "s/versionCode .*/versionCode $VCODE/" app/build.gradle
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/tripmind-release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab dist/tripmind-${{ github.run_number }}.aab
          cp android/app/build/outputs/apk/release/app-release.apk dist/tripmind-${{ github.run_number }}.apk
          cp android/app/build/outputs/mapping/release/mapping.txt dist/mapping-${{ github.run_number }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ github.run_number }}
          path: dist/
          retention-days: 30

  # ── RELEASE GITHUB (Attend le build + approbation manuelle) ──
  # Deux verrous indépendants — les deux doivent être levés pour publier :
  #
  # Environment gate : le job s'arrête et attend
  # un clic "Approve" dans Actions → ce run → Review deployments.
  # → pour activer : Settings → Environments → New → "release"
  #                  cocher "Required reviewers" et s'ajouter
  #
  # Sans le tag, le job est skippé même si l'environment n'est pas configuré.
  release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-latest
    environment: release        # ← pause ici jusqu'à approbation manuelle
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-android.outputs.artifact-name }}
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "TripMind build #${{ github.run_number }}"
          body: |
            Build #${{ github.run_number }} (Qualité validée ✅)
            📦 **tripmind-${{ github.run_number }}.aab** (Play Store)
            📱 **tripmind-${{ github.run_number }}.apk** (Sideload)
            🧪 [Rapport Playwright](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            🔬 [Couverture unit tests](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            dist/*.aab
            dist/*.apk
            dist/*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
