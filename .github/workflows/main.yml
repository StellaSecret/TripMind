name: CI/CD TripMind

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 9 * *'  # Every 9th of the month at 02:00 UTC — runs @live Playwright tests
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── SÉCURITÉ 1 : SCAN DE SECRETS ───────────────────────
  scan-secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ── SÉCURITÉ 2 : ANALYSE STATIQUE (CODEQL) ─────────────
  codeql-analysis:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - name: Perform Analysis
        uses: github/codeql-action/analyze@v4

  # ── SÉCURITÉ 3 : AUDIT NPM ─────────────────────────────
  npm-security:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install & Audit
        run: |
          npm ci
          npm audit --audit-level=high

  # ── UNIT TESTS (Vitest — no browser, ~5s) ──────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: unit/package-lock.json

      - name: Install unit test dependencies
        working-directory: unit
        run: npm ci

      - name: Run unit tests
        working-directory: unit
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-${{ github.run_number }}
          path: unit/coverage/
          retention-days: 14

  # ── PARALLEL MUTATION TEST JOB ─────────────────────────
  # Runs Stryker on each extracted lib module separately (parallel matrix).
  # Non-blocking: only infrastructure failures (unparseable/no-mutants report)
  # fail the job — missed mutants are reported as warnings in the summary job.
  mutation-tests:
    name: Mutation Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: score
            files: lib/score.ts
          - name: cache
            files: lib/cache.ts
          - name: errors
            files: lib/errors.ts
            # Equivalent mutants (proven: default lang `''`≡'fr', 4xx code `''`
            # and `?.[0]` are unreachable — the HTTP 4\d\d guard guarantees a match)
            exclude_re: 'errors\.ts:(7:79|22:46):StringLiteral|errors\.ts:22:19:OptionalChaining'
          - name: modes
            files: lib/modes.ts
          - name: ratelimit
            files: lib/ratelimit.ts
            exclude_re: 'ratelimit\.ts:35:52:BlockStatement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: unit/package-lock.json
      - name: Install unit test dependencies
        working-directory: unit
        run: npm ci
      - name: "Run mutation tests (${{ matrix.name }})"
        id: mutants
        working-directory: unit
        run: |
          set -o pipefail
          i=0
          fatal=0
          TIMEOUT="${{ matrix.timeout }}"
          if [ -z "$TIMEOUT" ]; then
            TIMEOUT=300
          fi
          for f in ${{ matrix.files }}; do
            echo "::group::$f"
            EXCLUDE_RE="${{ matrix.exclude_re }}"
            timeout "$TIMEOUT" npx stryker run --mutate "$f" --reporters json,progress,html && ec=0 || ec=$?
            if [ "$ec" -ne 0 ]; then
              echo "WARN: stryker exited $ec on $f (report may still be valid)"
            fi
            parse_args=(reports/mutation/mutation.json "work-$i/mutants.out")
            if [ -n "$EXCLUDE_RE" ]; then
              parse_args+=(--exclude-re "$EXCLUDE_RE")
            fi
            node scripts/mutants-txt.mjs "${parse_args[@]}" && p=0 || p=$?
            rm -rf reports/mutation
            echo "::endgroup::"
            if [ "$p" -eq 2 ]; then
              echo "FATAL: mutants-txt exited $p on $f (infrastructure failure)"
              fatal=$p
            elif [ "$p" -eq 1 ]; then
              echo "WARN: $f has missed mutants — see work-$i/mutants.out/missed.txt"
            else
              echo "mutants-txt exited $p on $f"
            fi
            i=$((i + 1))
          done
          mkdir -p mutants.out
          for d in work-*/mutants.out; do
            [ -f "$d/caught.txt" ] && cat "$d/caught.txt" >> mutants.out/caught.txt
            [ -f "$d/missed.txt" ] && cat "$d/missed.txt" >> mutants.out/missed.txt
            [ -f "$d/unviable.txt" ] && cat "$d/unviable.txt" >> mutants.out/unviable.txt
          done
          echo "Merged $(wc -l < mutants.out/caught.txt 2>/dev/null || echo 0) caught, $(wc -l < mutants.out/missed.txt 2>/dev/null || echo 0) missed, $(wc -l < mutants.out/unviable.txt 2>/dev/null || echo 0) unviable"
          echo "fatal=$fatal" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-${{ matrix.name }}
          path: unit/mutants.out
          retention-days: 30
      - name: Fail on mutation infrastructure errors only
        if: steps.mutants.outputs.fatal != '0'
        run: |
          echo "mutation testing infra error (unparseable report / no mutants) — exiting"
          exit ${{ steps.mutants.outputs.fatal }}

  mutation-summary:
    name: Mutation Tests Summary
    if: always()
    needs: [mutation-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download all mutant artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mutants-*
          path: mutants/
          merge-multiple: false
      - name: Report results
        run: |
          echo "## Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Shard | Caught | Missed | Unviable |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          total_caught=0
          total_missed=0
          total_unviable=0
          while IFS= read -r caught_file; do
            dir=$(dirname "$caught_file")
            name=$(basename "$dir")
            if [ "$name" = "mutants" ]; then
              name="all"
            elif [[ "$name" == mutants-* ]]; then
              name="${name#mutants-}"
            fi
            caught=$(wc -l < "$caught_file")
            missed=0; unviable=0
            [ -f "$dir/missed.txt" ] && missed=$(wc -l < "$dir/missed.txt")
            [ -f "$dir/unviable.txt" ] && unviable=$(wc -l < "$dir/unviable.txt")
            total_caught=$((total_caught + caught))
            total_missed=$((total_missed + missed))
            total_unviable=$((total_unviable + unviable))
            if [ "$missed" -gt 0 ]; then
              echo "| $name | $caught | **$missed** | $unviable |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | $caught | $missed | $unviable |" >> $GITHUB_STEP_SUMMARY
            fi
          done < <(find mutants -name caught.txt 2>/dev/null | sort) || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $total_caught caught / $total_missed missed / $total_unviable unviable**" >> $GITHUB_STEP_SUMMARY

  # ── TESTS NON-RÉGRESSION (Playwright) ──────────────────
  # Runs in parallel with unit tests — both must pass before deploy
  playwright-tests:
    name: Non-Regression Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: e2e
        run: |
          npm ci

      - name: Serve app on port 3000
        run: |
          npx serve www --listen 3000 > serve.log 2>&1 &
          echo "Waiting for app to be ready..."
          if ! timeout 30 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 1; done'; then
            echo "App failed to start. Logs:"
            cat serve.log
            exit 1
          fi
          echo "App is ready on port 3000"

      - name: Upload serve logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: serve-logs-${{ github.run_number }}-${{ matrix.shardIndex }}
          path: e2e/serve.log
          retention-days: 7

      - name: Run offline tests (Chromium)
        working-directory: e2e
        run: npx --no playwright test --grep-invert "@live" --project=chromium --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_number }}-${{ matrix.shardIndex }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}-${{ matrix.shardIndex }}
          path: e2e/test-results/
          retention-days: 7


  # ── TESTS @LIVE NOCTURNES (Playwright — vraie réseau) ──
  # Tourne chaque 9 du mois à 02h00 UTC pour détecter les régressions
  # dues aux changements d'API Transitous / Nominatim / BAN.
  playwright-live-tests:
    name: Live API Tests (monthly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Serve app on port 3000
        run: |
          npx serve www --listen 3000 > serve.log 2>&1 &
          if ! timeout 30 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 1; done'; then
            echo "App failed to start. Logs:"
            cat serve.log
            exit 1
          fi

      - name: Upload serve logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: serve-logs-live-${{ github.run_number }}
          path: e2e/serve.log
          retention-days: 7

      - name: Run @live tests (Chromium)
        working-directory: e2e
        run: npx --no playwright test --grep "@live" --project=chromium
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload live test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-live-report-${{ github.run_number }}
          path: e2e/playwright-report/
          retention-days: 7

  # ── DÉPLOIEMENT PAGES (Bloqué par unit + playwright) ───
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [unit-tests, playwright-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./www
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # ── BUILD ANDROID (Bloqué par unit + playwright) ────────
  build-android:
    name: Build AAB & APK
    needs: [unit-tests, playwright-tests, mutation-tests]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'build-review' || 'build' }}
    outputs:
      artifact-name: artifacts-${{ github.run_number }}
    env:
      # GitHub Actions does not expose repository secrets to workflow runs triggered
      # by Dependabot or by pull requests from forks. Trying to sign with an empty
      # KEYSTORE_BASE64 produces a 0-byte "keystore" and Gradle fails with a
      # confusing "Tag number over 30 is not supported" error. So on those runs we
      # skip signing entirely and build an unsigned debug APK/AAB just to confirm
      # the app still compiles.
      HAS_SIGNING_SECRETS: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install & Sync
        run: |
          npm ci
          npx cap sync android

      - name: Decode keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/tripmind-release.jks

      - name: Build signed Android App (release)
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          cd android
          chmod +x gradlew
          VCODE=$(date -u +%Y%m%d)$(printf '%02d' $(( ${{ github.run_number }} % 100 )))
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -PversionCode=$VCODE \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/tripmind-release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Build unsigned Android App (no repo secrets on this run)
        if: env.HAS_SIGNING_SECRETS != 'true'
        run: |
          cd android
          chmod +x gradlew
          VCODE=$(date -u +%Y%m%d)$(printf '%02d' $(( ${{ github.run_number }} % 100 )))
          ./gradlew bundleDebug assembleDebug --no-daemon -PversionCode=$VCODE

      - name: Collect artifacts (signed release)
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab dist/tripmind-${{ github.run_number }}.aab
          cp android/app/build/outputs/apk/release/app-release.apk dist/tripmind-${{ github.run_number }}.apk
          cp android/app/build/outputs/mapping/release/mapping.txt dist/mapping-${{ github.run_number }}.txt

      - name: Collect artifacts (unsigned debug — build validation only)
        if: env.HAS_SIGNING_SECRETS != 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/debug/app-debug.aab dist/tripmind-${{ github.run_number }}-debug.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/tripmind-${{ github.run_number }}-debug.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ github.run_number }}
          path: dist/
          retention-days: 30

  # ── RELEASE GITHUB (Attend le build + approbation manuelle) ──
  # Deux verrous indépendants — les deux doivent être levés pour publier :
  #
  # Environment gate : le job s'arrête et attend
  # un clic "Approve" dans Actions → ce run → Review deployments.
  # → pour activer : Settings → Environments → New → "release"
  #                  cocher "Required reviewers" et s'ajouter
  #
  # Sans le tag, le job est skippé même si l'environment n'est pas configuré.
  release:
    name: Create Release
    if: github.ref == 'refs/heads/main'
    needs: build-android
    runs-on: ubuntu-latest
    environment: release        # ← pause ici jusqu'à approbation manuelle
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-android.outputs.artifact-name }}
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: "TripMind build #${{ github.run_number }}"
          body: |
            Build #${{ github.run_number }} (Qualité validée ✅)
            📦 **tripmind-${{ github.run_number }}.aab** (Play Store)
            📱 **tripmind-${{ github.run_number }}.apk** (Sideload)
            🧪 [Rapport Playwright](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            🔬 [Couverture unit tests](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            dist/*.aab
            dist/*.apk
            dist/*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
